<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LevelUp — spel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230097db'/%3E%3Cpath d='M50 22 80 74H20z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page">
    <section class="kid-hero" id="kid-hero"></section>

    <div class="grid-2 wide-left">
      <section class="card">
        <div class="card-head">
          <h2>🎯 Missies uit jouw uitgaven</h2>
          <span class="muted small" id="mission-progress"></span>
        </div>
        <p class="card-sub">Echte voorbeelden van je eigen rekening. Een juist antwoord levert XP op voor dat onderwerp.</p>
        <div class="missions" id="missions"></div>
      </section>

      <aside class="card sticky">
        <h2>📈 Jouw niveaus</h2>
        <p class="card-sub">Groeit mee met elke missie en simulatie.</p>
        <div id="level-bars"></div>
        <a class="link-more" href="profiel.html">Bekijk je volledige profiel →</a>
      </aside>
    </div>

    <section class="card" id="sim-card"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/spel.js"></script>
</body>
</html>
